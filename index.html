<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="sqlite file viewer">
    <meta name="keywords" content="sqlite,viewer,db,database,online">
    <meta name="author" content="Juraj Novák">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite Viewer</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/select2.min.css" rel="stylesheet">
    <link href="css/select2-bootstrap-5-theme.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link rel="image_src" href="img/icon.png" />
    <link rel="icon" type="image/png" href="img/icon.png"/>
    <meta property="og:url" content="https://inloop.github.io/sqlite-viewer/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SQLite Viewer">
    <meta property="og:description" content="sqlite file viewer">
    <meta property="og:image" content="https://inloop.github.io/sqlite-viewer/img/icon.png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N22SYDVQHZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-N22SYDVQHZ');
    </script>
</head>
<body>

<img src="img/icon.png" style="display: none;"/>

<div id="main-container" class="container shadow bg-white">
    <header id="header" class="row align-items-center p-4">
        <img src="img/logo.svg" width="54" height="54" class="col-auto p-0" alt="Database logo"/>

        <div class="col">
            <h4 class="mb-0">HDB Resale Analysis</h4>
            <p class="mb-0">Singapore property price trends and insights</p>
        </div>

        <a href="#" id="resizer" aria-label="Expand/Collapse" class="col-auto text-decoration-none" style="color: #3474A8">
            <svg id="resizer-expand" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrows-angle-expand" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707m4.344-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707"/>
            </svg>
            <svg id="resizer-collapse" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrows-angle-contract collapse" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M.172 15.828a.5.5 0 0 0 .707 0l4.096-4.096V14.5a.5.5 0 1 0 1 0v-3.975a.5.5 0 0 0-.5-.5H1.5a.5.5 0 0 0 0 1h2.768L.172 15.121a.5.5 0 0 0 0 .707M15.828.172a.5.5 0 0 0-.707 0l-4.096 4.096V1.5a.5.5 0 1 0-1 0v3.975a.5.5 0 0 0 .5.5H14.5a.5.5 0 0 0 0-1h-2.768L15.828.879a.5.5 0 0 0 0-.707"/>
            </svg>
        </a>
    </header>

    <div id="compat-error" class="alert alert-danger row rounded-0 d-none" role="alert">
        Sorry but your browser does not support some of new HTML5 features! Try using latest version of Google Chrome or Firefox.
    </div>

    <div id="loading-container" class="row text-center p-3 align-items-stretch">
        <div class="d-flex align-items-center justify-content-center">
            <div id="drop-loading" class="d-flex align-items-center d-none">
                <div class="spinner-border me-2" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <b>Loading database...</b>
            </div>
        </div>
    </div>

    <div id="output-box" class="container-fluid">
        <ul class="nav nav-tabs mb-4" id="analysisTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="trends-tab" data-bs-toggle="tab" data-bs-target="#trends-pane" type="button" role="tab">Market Trends</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="neighbour-tab" data-bs-toggle="tab" data-bs-target="#neighbour-pane" type="button" role="tab">Neighbourhood Search</button>
            </li>
        </ul>

        <div class="tab-content" id="analysisTabsContent">
            <!-- Market Trends Tab -->
            <div class="tab-pane fade show active" id="trends-pane" role="tabpanel">
                <div id="filter-controls" class="row g-2 mb-3 align-items-end" style="display:none;">
                    <div class="col-md-3">
                        <label for="filter-towns" class="form-label small">Towns</label>
                        <select id="filter-towns" class="form-select" multiple title="Select Towns"></select>
                    </div>
                    <div class="col-md-3">
                        <label for="filter-flat-types" class="form-label small">Flat Types</label>
                        <select id="filter-flat-types" class="form-select" multiple title="Select Flat Types"></select>
                    </div>
                    <div class="col-md-4">
                        <label for="filter-exclude-models" class="form-label small">Exclude Models</label>
                        <select id="filter-exclude-models" class="form-select" multiple title="Exclude Models"></select>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-months" class="form-label small">Months Ago</label>
                        <input type="number" id="filter-months" class="form-control" value="60" min="1">
                    </div>
                </div>
                <div class="d-flex mb-3 justify-content-end">
                    <button class="btn btn-success px-5" id="plot-run" type="button" onclick="plotAnalysis()">Update Trends Plot</button>
                </div>
            </div>

            <!-- Neighbourhood Tab -->
            <div class="tab-pane fade" id="neighbour-pane" role="tabpanel">
                <div class="row g-2 mb-3 align-items-end">
                    <div class="col-md-4">
                        <label for="target-address" class="form-label small">Target Address</label>
                        <input type="text" id="target-address" class="form-control" placeholder="e.g. 406 Ang Mo Kio Ave 10">
                    </div>
                    <div class="col-md-2">
                        <label for="target-radius" class="form-label small">Radius (meters)</label>
                        <input type="number" id="target-radius" class="form-control" value="1000" min="100" step="100">
                    </div>
                    <div class="col-md-3">
                        <label for="neighbour-flat-types" class="form-label small">Flat Types</label>
                        <select id="neighbour-flat-types" class="form-select" multiple title="Select Flat Types"></select>
                    </div>
                    <div class="col-md-2">
                        <label for="neighbour-months" class="form-label small">Months Ago</label>
                        <input type="number" id="neighbour-months" class="form-control" value="24" min="1">
                    </div>
                </div>
                <div class="d-flex mb-3 justify-content-end">
                    <button class="btn btn-primary px-5" id="neighbour-run" type="button" onclick="plotNeighbourhood()">Search Neighbourhood</button>
                </div>
            </div>
        </div>

        <div class="alert alert-danger" id="error" style="display: none"></div>
        <div class="alert alert-info" id="info" style="display: none"></div>
        
        <div id="plot-container" class="mb-4" style="height: 600px; display: none;"></div>

        <div class="row pb-4">
            <div class="overflow-x-auto">
                <table id="data" class="table table-sm table-bordered table-hover table-striped">
                    <thead>
                    <tr></tr>
                    </thead>
                    <tbody class="table-group-divider"></tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<div id="bottom-bar" class="d-flex position-sticky justify-content-center bottom-0 pb-4 d-none pe-none">
    <div class="row bg-white border border-dark shadow p-3 rounded-2 pe-auto">
        <button class="btn btn-outline-secondary btn-sm lh-1 col-auto" id="page-prev" type="submit" onclick="setPage(this, false)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-left-fill" viewBox="0 0 16 16">
                <path d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
            </svg>
        </button>
        <a href="javascript:void(0)" data-bs-toggle="tooltip" class="text-decoration-none col-auto" onclick="setPage(this)" id="pager"></a>
        <button class="btn btn-outline-secondary btn-sm lh-1 col-auto" id="page-next" type="submit" onclick="setPage(this, true)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
                <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
            </svg>
        </button>
    </div>
</div>

<footer class="col text-center text-secondary py-2 my-1 small" id="footer">
</footer>

<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/filereader.js"></script>
<script src="js/sql-wasm.js?v=1100"></script>
<script src="js/select2.min.js?v=4013"></script>
<script src="js/ace/ace.js?v=1323"></script>
<script src="js/bootstrap.bundle.min.js?v=532"></script>
<script src="js/mindmup-editabletable.js"></script>
<script src="js/jszip.min.js"></script>
<script src="js/FileSaver.min.js"></script>
<script src="js/plotly.min.js"></script>
<script src="js/main.js?v=18"></script>

</body>
</html>
